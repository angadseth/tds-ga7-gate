name: TDS GA7 Release Gate

# Scoped to this file so committing one student's evidence does not re-run
# every other workflow in the repository.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ga7-958e8ccd27c5.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - name: 'TDS identity: 22f1001623@ds.study.iitm.ac.in'
        run: echo "TDS GA7 release gate - 22f1001623@ds.study.iitm.ac.in"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Test the release-gate implementation
        run: python release_gate_test.py
